<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <title>Raedworkouts Go</title>
  <meta name="description" content="تطبيق رائد للتمارين: تقدّم تدريجي، يعمل دون اتصال، ومزامنة ذاتية." />
  <meta id="theme-color-light" name="theme-color" content="#7c1f2e" media="(prefers-color-scheme: light)" />
  <meta id="theme-color-dark" name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Raedworkouts Go" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml" />
  <!-- iOS does not accept SVG for apple-touch-icon, and it does not read the
       manifest's icons for the home screen either. This app is installed on
       exactly one iPhone, and until now that home-screen tile was iOS's
       fallback: a downscaled screenshot of the first paint. The PNG is
       full-bleed and opaque on purpose — iOS applies its own corner mask, and
       renders any transparency as black. -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="app-title">
      <svg class="brand-mark" viewBox="0 0 200 130" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M29 50V74M35 42V82M165 42V82M171 50V74M36 62H164"/></svg>
      <span data-i18n="app_name">Raedworkouts Go</span>
    </div>
    <div class="header-actions">
      <button id="gym-launch" class="header-btn" data-i18n-title="open_gym" data-i18n-aria-label="open_gym" title="افتح النادي" aria-label="افتح النادي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="page" id="page-home"></section>
    <section class="page" id="page-library"></section>
    <section class="page" id="page-history"></section>
    <section class="page" id="page-settings"></section>
    <section class="page" id="page-preview"></section>
    <section class="page" id="page-coach"></section>
    <section class="page" id="page-help"></section>
    <section class="page" id="page-end"></section>
    <section class="page" id="page-runner"></section>
  </main>

  <nav class="tab-bar">
    <button class="tab" data-route="home" data-i18n-aria-label="home" aria-label="الرئيسية"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.2 12 3l9 7.2"/><path d="M5.5 9.3V20h13V9.3"/><path d="M9.5 20v-5.5h5V20"/></svg></span><span class="label" data-i18n="home">الرئيسية</span></button>
    <button class="tab" data-route="library" data-i18n-aria-label="library" aria-label="المكتبة"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.2A2.2 2.2 0 0 1 6.2 17H20"/><path d="M6.2 2H20v20H6.2A2.2 2.2 0 0 1 4 19.8V4.2A2.2 2.2 0 0 1 6.2 2z"/></svg></span><span class="label" data-i18n="library">المكتبة</span></button>
    <button class="tab" data-route="history" data-i18n-aria-label="history" aria-label="السجل"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 11l4 4 8-8"/><path d="M15 7h6v6"/></svg></span><span class="label" data-i18n="history">السجل</span></button>
    <button class="tab" data-route="coach" data-i18n-aria-label="coach" aria-label="المدرب"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><!-- Was a headset. In an app that also has playlists, a headset in the tab bar reads as "music", not "ask the coach" — Raed said so. A brain is distinct from both that and the book already used for the library, and matches the 🧠 now shown on the coach row in Settings. --><path d="M12 5.5a3 3 0 0 0-5.9-.7A2.8 2.8 0 0 0 4 7.4c0 .7.3 1.4.7 1.9A2.9 2.9 0 0 0 4 11.5c0 1 .5 1.9 1.3 2.4A2.8 2.8 0 0 0 8 18c.9 0 1.7-.4 2.2-1"/><path d="M12 5.5a3 3 0 0 1 5.9-.7A2.8 2.8 0 0 1 20 7.4c0 .7-.3 1.4-.7 1.9A2.9 2.9 0 0 1 20 11.5c0 1-.5 1.9-1.3 2.4A2.8 2.8 0 0 1 16 18c-.9 0-1.7-.4-2.2-1"/><path d="M12 5.5V20"/></svg></span><span class="label" data-i18n="coach">المدرب</span></button>
    <button class="tab" data-route="settings" data-i18n-aria-label="settings" aria-label="الإعدادات"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6H3"/><path d="M21 6h-7"/><circle cx="12" cy="6" r="2"/><path d="M7 12H3"/><path d="M21 12h-9"/><circle cx="9" cy="12" r="2"/><path d="M13 18H3"/><path d="M21 18h-3"/><circle cx="15" cy="18" r="2"/></svg></span><span class="label" data-i18n="settings">الإعدادات</span></button>
  </nav>

  <!-- Floating rest timer. aria-live is off: it reprints every 200ms, and a
       polite region would read the countdown aloud continuously. -->
  <div id="rest-timer" class="rest-timer" style="display:none;">
    <span class="rt-ico" aria-hidden="true">⏱</span>
    <span id="rest-timer-text" class="rt-time" aria-live="off">2:00</span>
    <button id="rest-cancel" class="rt-cancel" data-i18n-aria-label="cancel_rest" aria-label="ألغِ الراحة">✕</button>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal" class="modal"></div>
  </div>

  <!-- Toast. This is the app's only channel for "your set was not saved" and
       "nothing was saved anywhere", so it has to be announced, not just drawn.
       assertive rather than polite: by the time a save has failed, interrupting
       is the point. -->
  <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script src="./data.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
